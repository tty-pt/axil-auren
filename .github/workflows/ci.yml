name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: axil-auren
      deps: "axil,libxylem,libstele,libcorm,libsepal,libvulkan-dev,vulkan-tools,glslang-tools,cmake,wget,libjson-c-dev"
      deps_pacman: "axil,libxylem,libstele,libcorm,libsepal,vulkan-headers,vulkan-icd-loader,vulkan-tools,glslang,cmake,wget,json-c"
      deps_apk: "axil,libxylem,libstele,libcorm,libsepal,vulkan-loader,vulkan-loader-dev,vulkan-headers,vulkan-tools,cmake,xz,wget,json-c-dev"
      deps_rpm: "axil,libxylem,libstele,libcorm,libsepal,vulkan-headers,vulkan-loader,vulkan-loader-devel,vulkan-tools,glslang,cmake,wget,g++,json-c-devel"
      deps_brew: "axil,libxylem,libstele,libcorm,libsepal,cmake,libomp,json-c"
      publish_to: "deb,rpm,brew"
      test_build: "true"
    secrets: inherit
